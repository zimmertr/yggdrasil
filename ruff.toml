# The rule set hevy-trainer-sync and Bluebird use. Ruff's defaults are only
# E4, E7, E9 and F. BLE is the blind `except Exception`; a broad catch that
# stays says why on its line, as `# noqa: BLE001 reason`.
target-version = "py313"
line-length = 120

[lint]
select = ["E", "F", "I", "B", "UP", "BLE"]
