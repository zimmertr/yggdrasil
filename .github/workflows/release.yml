name: release

# The release module: the next version; the caller's images built, pushed and
# scanned; then the git tag and GitHub release, which wait on every scan; then
# the caller's Helm charts pushed under the same version; then a PR in each
# deploy repo that points it at the release. A caller runs it on every push to
# main, and may run it on PRs with `dry-run`, where it says in the job summary
# what the merge will release, builds the images without pushing them and
# packages the charts. Decision records 0027, 0032, 0033, 0034 and 0054.
#
# The caller sets `concurrency` (one release at a time) and grants
# `contents: write`, which only the Tag and Release job uses, and
# `packages: write`, which only Build & Push and Push Chart use. Images and
# charts go to GHCR, pushed with the job's own token (decision record 0052).
on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment the Tag and Release job runs in, for its protection rules. Empty for none.
        type: string
        default: ''
      dry-run:
        description: Work out the version, build the images and package the charts, but push, tag and release nothing.
        type: boolean
        default: false
      images:
        description: >-
          JSON list of the images to build and push under the version, each
          {"image": "zimmertr/name", "context": ".", "file": "path/Dockerfile",
          "platforms": "linux/amd64,linux/arm64", "cache": true}, pushed to
          ghcr.io/<image>, lowercased. Only `image` is required. `context` defaults to the repo root, `file` (from the
          repo root) to the context's Dockerfile, `platforms` to linux/amd64,
          and `cache` to false. Empty for none.
        type: string
        default: '[]'
      charts:
        description: >-
          JSON list of the Helm charts to push under the version, each
          {"chart": "charts/name", "image": "ghcr.io/zimmertr/name",
          "digest-set": ".image.digest"}, pushed to oci://ghcr.io/<owner>,
          lowercased, under the name in its Chart.yaml. Only `chart`, the
          chart's folder, is required. With `image` and `digest-set`, the
          chart's appVersion becomes the version and the digest of `image` at
          this version is written into the chart's values.yaml at that yq
          path. Without them the chart keeps its Chart.yaml's appVersion.
          Empty for none.
        type: string
        default: '[]'
      deploys:
        description: >-
          JSON list of the files to point at the release, one PR each:
          {"repo": "zimmertr/Kubernetes-Manifests", "file": "path/kustomization.yml",
          "set": "yq path, such as .appVersion", "branch": "chore/name-image",
          "title": "chore(scope): bump name", "image": "ghcr.io/zimmertr/name",
          "digest-set": "yq path, such as .images[0].digest"}. The version is
          appended to the title as " to X.Y.Z". With `digest-set`, the PR also
          writes the digest of `image` at this version there. Empty for none.
        type: string
        default: '[]'
    secrets:
      deploy-token:
        description: Token with contents and pull-requests write on every `deploys` repo. Needed when `deploys` isn't empty.
        required: false

permissions:
  contents: read

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      releases: ${{ steps.version.outputs.releases }}
      scans: ${{ steps.scans.outputs.scans }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # GitVersion needs every commit and tag
          persist-credentials: false
      # A caller with its own GitVersion.yml uses it. Otherwise the module's
      # default, read at the commit the caller pinned (records 0006, 0022).
      - if: hashFiles('GitVersion.yml') == ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .yggdrasil
          persist-credentials: false
      # A PR's merge commit carries GitHub's message, not the PR title, so
      # GitVersion would misread it. Build the squash commit the merge will
      # make instead: the PR's changes on top of the base branch, titled with
      # the PR title. Staged changes only, so .yggdrasil stays out of it.
      - if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          MERGE=$(git rev-parse HEAD)
          git checkout -q -B "$BASE" "origin/$BASE"
          git merge -q --squash "$MERGE"
          git -c user.name=release -c user.email=release@localhost commit -q --allow-empty -m "$TITLE"
      # GitVersion's image rather than gittools/actions, so it sees only the
      # repo and none of the runner's GITHUB_* variables, which would make it
      # read a PR as a branch build. Renovate doesn't see this pin: bump it
      # by hand.
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CONFIG=GitVersion.yml
          [ -f "$CONFIG" ] || CONFIG=.yggdrasil/defaults/GitVersion.yml
          VERSION=$(docker run --rm -v "$PWD:/repo" \
            gittools/gitversion:6.8.2@sha256:f10e8320b2cf86f879a9304e074ac11f16b897380e0e4a86dd39682b265da568 \
            /repo /config "/repo/$CONFIG" /nocache /output json /format '{SemVer}' | tail -n 1)
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::GitVersion gave '${VERSION}'"; exit 1; }
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          # A merge that touches nothing GitVersion counts gives back the last
          # tagged version, which is how a settings-only merge releases nothing.
          # A run for a commit main has moved past releases nothing too, as
          # semantic-release refuses a branch behind its remote: the release
          # from main's newest commit counts this one's change, and an old run
          # would push an image it may never tag and point the deploys back at
          # an older version (record 0053). Main's head comes from the API:
          # for a push, actions/checkout sets origin/main to the run's own
          # commit, so the clone can't tell.
          if [ "$GITHUB_REF" = refs/heads/main ] && [ "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)" != "$GITHUB_SHA" ]; then
            RELEASES=false
            echo "Releases nothing: main has moved past this commit, and the release from main's newest commit includes it." | tee -a "$GITHUB_STEP_SUMMARY"
          elif git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            RELEASES=false
            echo "Releases nothing: v${VERSION} is already tagged." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            RELEASES=true
            echo "Releases v${VERSION}." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          echo "releases=${RELEASES}" >> "$GITHUB_OUTPUT"
      # One scan per image and platform, since Trivy reads one platform of an
      # index at a time.
      - id: scans
        env:
          IMAGES: ${{ inputs.images }}
        run: |
          echo "scans=$(jq -c '[.[] | ("ghcr.io/" + (.image | ascii_downcase)) as $i | (.platforms // "linux/amd64" | split(",")[]) | {image: $i, platform: .}]' <<< "$IMAGES")" >> "$GITHUB_OUTPUT"

  build:
    name: Build & Push (${{ matrix.image }})
    needs: version
    # A dry run builds every image as a test. A real run builds only on main,
    # for a version not yet tagged, from main's newest commit.
    if: inputs.images != '[]' && (inputs.dry-run || (github.ref == 'refs/heads/main' && needs.version.outputs.releases == 'true'))
    runs-on: ubuntu-latest
    # Releases run one at a time, so a hung push would hold every later merge
    # until GitHub's six-hour default.
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write  # the push to GHCR
    strategy:
      matrix:
        include: ${{ fromJSON(inputs.images) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # arm64 and any other platform the runner can't run natively.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      # The docker-container driver, which the attestations need.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: ${{ !inputs.dry-run }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # The tag and the OCI labels (version, revision, source, created and the
      # rest). The version only, no `latest`: deploys pin the version, and a
      # moving tag is one nothing should pull.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          # GHCR wants lowercase, which the action gives: Bluebird-Forecast's
          # images go to ghcr.io/bluebird-forecast.
          images: ghcr.io/${{ matrix.image }}
          tags: type=raw,value=${{ needs.version.outputs.version }}
          flavor: latest=false
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context || '.' }}
          file: ${{ matrix.file || '' }}
          platforms: ${{ matrix.platforms || 'linux/amd64' }}
          push: ${{ !inputs.dry-run }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The names hevy-trainer-sync and Bluebird read. An image that uses
          # none of them builds the same, with a warning.
          build-args: |
            APP_VERSION=${{ needs.version.outputs.version }}
            APP_COMMIT=${{ github.sha }}
            APP_BUILT_AT=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          provenance: mode=max
          sbom: true
          cache-from: ${{ matrix.cache && 'type=gha' || '' }}
          cache-to: ${{ matrix.cache && 'type=gha,mode=max' || '' }}

  # What the registry holds, scanned before anything points at it: the PR scan
  # saw only an amd64 build of the PR branch. By the version tag: only a run
  # for a version with no git tag yet builds, so nothing else pushes it. No
  # login: a package pushed from a public repo starts public, so Trivy's code
  # sees no credential. A fixable Critical or High holds
  # the tag and release back; the image stays pushed, and the fix is the next
  # release.
  scan:
    name: Scan Pushed Image (${{ matrix.image }}, ${{ matrix.platform }})
    needs: [version, build]
    if: ${{ !inputs.dry-run && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      # Report every image and platform even when one fails.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.version.outputs.scans) }}
    steps:
      # Only for the scan settings: the caller's trivy.yaml, or the module's
      # default (records 0006, 0022).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: hashFiles('trivy.yaml') == ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .yggdrasil
          persist-credentials: false
      - name: Fail on fixable Critical or High vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: ${{ matrix.platform }}
        with:
          image-ref: ${{ matrix.image }}:${{ needs.version.outputs.version }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          trivy-config: ${{ hashFiles('trivy.yaml') != '' && 'trivy.yaml' || '.yggdrasil/defaults/trivy.yaml' }}

  release:
    name: Tag and Release
    needs: [version, build, scan]
    # Main only: a release from any other ref would tag that ref. With no
    # images, build and scan are skipped, which is fine; a failure in either
    # stops it.
    if: ${{ !cancelled() && !failure() && !inputs.dry-run && github.ref == 'refs/heads/main' && needs.version.outputs.releases == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ${{ inputs.environment }}
    permissions:
      contents: write  # the tag and the release
    steps:
      # One call makes the tag at this commit and the release, with notes from
      # the merged PR titles. No checkout, so no credential sits on disk.
      - env:
          TAG: v${{ needs.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          echo "Released ${TAG}." >> "$GITHUB_STEP_SUMMARY"

  # After the tag, so a chart version is pushed only for a commit that carries
  # it, and a version already in GHCR is never pushed again: Argo CD pins a
  # chart by version, not digest, and GHCR would replace it (record 0052). So
  # "Re-run failed jobs" finishes a release whose push failed and repeats
  # nothing. A dry run packages each chart, which proves its folder and its
  # dependencies, and pushes nothing.
  chart:
    name: Push Chart (${{ matrix.chart }})
    needs: [version, release]
    if: ${{ !cancelled() && !failure() && inputs.charts != '[]' && (inputs.dry-run || needs.release.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write  # the push to GHCR
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.charts) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          # Exact: with no version the action installs whatever Helm is newest
          # on the day. Renovate reads this input, and bumps it here and in
          # chart.yml in one PR.
          version: v4.3.1
      # Before the check below, so it also sees a private package.
      - if: ${{ !inputs.dry-run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      # The chart's name is its OCI path, so it comes from Chart.yaml.
      - id: chart
        env:
          CHART: ${{ matrix.chart }}
          VERSION: ${{ needs.version.outputs.version }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          NAME=$(helm show chart "$CHART" | sed -n 's/^name: //p')
          REGISTRY="oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "registry=${REGISTRY}" >> "$GITHUB_OUTPUT"
          if [ "$DRY_RUN" = false ] && helm show chart "${REGISTRY}/${NAME}" --version "$VERSION" >/dev/null 2>&1; then
            echo "pushed=true" >> "$GITHUB_OUTPUT"
            echo "Pushes nothing: ${NAME} ${VERSION} is already in GHCR." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          fi
      # The image this release pushed, by digest, written into the chart's
      # values so an install runs those bytes. Not in a dry run, which pushes
      # no image to read.
      - id: digest
        if: ${{ !inputs.dry-run && steps.chart.outputs.pushed == 'false' && matrix.digest-set != '' }}
        env:
          IMAGE: ${{ matrix.image }}:${{ needs.version.outputs.version }}
        run: |
          DIGEST=$(docker buildx imagetools inspect "$IMAGE" --format '{{.Manifest.Digest}}')
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
      - if: ${{ !inputs.dry-run && steps.chart.outputs.pushed == 'false' && matrix.digest-set != '' }}
        uses: mikefarah/yq@504fc38780cc46be8444ea1b72fb55919fc0bfb0 # v4.54.1
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
          FILE: ${{ matrix.chart }}/values.yaml
          SET: ${{ matrix.digest-set }}
        with:
          cmd: yq -i "$SET = strenv(DIGEST)" "$FILE" && yq -e "($SET) == strenv(DIGEST)" "$FILE"
      # --dependency-update fetches the chart's dependencies from the
      # repositories its Chart.yaml names, with no `helm repo add`. A chart
      # with an image ships the app this release built, so its appVersion is
      # the version; one without keeps its Chart.yaml's, which the app's own
      # release bumps.
      - if: steps.chart.outputs.pushed == 'false'
        env:
          CHART: ${{ matrix.chart }}
          VERSION: ${{ needs.version.outputs.version }}
          NAME: ${{ steps.chart.outputs.name }}
          REGISTRY: ${{ steps.chart.outputs.registry }}
          IMAGE: ${{ matrix.image }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          APP_VERSION=()
          [ -z "$IMAGE" ] || APP_VERSION=(--app-version "$VERSION")
          helm package "$CHART" --dependency-update --version "$VERSION" "${APP_VERSION[@]}"
          if [ "$DRY_RUN" = true ]; then
            echo "Dry run: packaged ${NAME} ${VERSION} and pushed nothing." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            helm push "${NAME}-${VERSION}.tgz" "$REGISTRY"
            echo "Pushed ${REGISTRY}/${NAME} ${VERSION}." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  # One PR per deploy file, on a fixed branch, so quick releases leave one
  # up-to-date PR, not a pile. After the release, because a chart repo's own
  # release follows the app's, and after the charts, so a deploy never names a
  # chart version that isn't in GHCR yet. Releases run one at a time, and a run
  # for a commit behind main releases nothing, so only "Re-run failed jobs" on
  # an old release whose Version job passed could point a deploy back at an
  # older version: don't; release again from main instead.
  deploy:
    name: Deploy Bump (${{ matrix.repo }})
    needs: [version, release, chart]
    # Spelled out because a caller with no charts skips the chart job, and a
    # skipped need would otherwise skip this one.
    if: ${{ !cancelled() && !failure() && needs.release.result == 'success' && inputs.deploys != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}  # everything here uses the deploy token
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.deploys) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.repo }}
          token: ${{ secrets.deploy-token }}
          persist-credentials: false
      # yq's own action, its image pinned by digest. -e fails the step when the
      # path matches nothing, which would otherwise pass for a deploy already
      # at this version.
      - uses: mikefarah/yq@504fc38780cc46be8444ea1b72fb55919fc0bfb0 # v4.54.1
        env:
          VERSION: ${{ needs.version.outputs.version }}
          FILE: ${{ matrix.file }}
          SET: ${{ matrix.set }}
        with:
          cmd: yq -i "$SET = strenv(VERSION)" "$FILE" && yq -e "($SET) == strenv(VERSION)" "$FILE"
      # The digest pins what the deploy runs, since a GHCR tag can be moved by
      # hand (record 0052). Read after the push, before anything points at it.
      - id: digest
        if: matrix.digest-set != ''
        env:
          IMAGE: ${{ matrix.image }}:${{ needs.version.outputs.version }}
        run: |
          DIGEST=$(docker buildx imagetools inspect "$IMAGE" --format '{{.Manifest.Digest}}')
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
      - if: matrix.digest-set != ''
        uses: mikefarah/yq@504fc38780cc46be8444ea1b72fb55919fc0bfb0 # v4.54.1
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
          FILE: ${{ matrix.file }}
          SET: ${{ matrix.digest-set }}
        with:
          cmd: yq -i "$SET = strenv(DIGEST)" "$FILE" && yq -e "($SET) == strenv(DIGEST)" "$FILE"
      # Pushes the fixed branch fresh off the default branch, then opens the PR
      # or edits the open one to this version. Does nothing when the file
      # already holds it. zizmor would have `gh pr create` instead, which does
      # only the last of those; the rest would be shell (record 0033).
      - id: pr  # zizmor: ignore[superfluous-actions]
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.deploy-token }}
          branch: ${{ matrix.branch }}
          commit-message: ${{ matrix.title }} to ${{ needs.version.outputs.version }}
          title: ${{ matrix.title }} to ${{ needs.version.outputs.version }}
          body: |
            Automated by the ${{ github.repository }} v${{ needs.version.outputs.version }} release.

            - Release: ${{ github.server_url }}/${{ github.repository }}/releases/tag/v${{ needs.version.outputs.version }}
      # Every push to the branch disarms auto-merge, so arm it each time. The
      # plain merge covers checks already green, where --auto is refused.
      - if: steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation == 'updated'
        env:
          REPO: ${{ matrix.repo }}
          PR: ${{ steps.pr.outputs.pull-request-number }}
          GH_TOKEN: ${{ secrets.deploy-token }}
        run: gh pr merge "$PR" --repo "$REPO" --auto --squash || gh pr merge "$PR" --repo "$REPO" --squash
