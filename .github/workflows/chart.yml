name: chart

# The PR chart module: the chart's dependencies fetched, `helm lint`, a render
# with the chart's defaults, then the chart's helm-unittest suites from its
# `tests/` folder. hevy-garmin-sync's and bluebird-helm's chart check. The
# release module pushes the chart, as it does the images this module's
# neighbour docker-build checks. Decision records 0054 and 0060.
#
# The caller runs it on `pull_request` and grants `contents: read`.
on:
  workflow_call:
    inputs:
      chart:
        description: The chart's folder, from the repo root.
        type: string
        required: true
      # Deprecated (record 0060): a chart's checks are helm-unittest suites.
      # Removed in a major once bluebird-helm and trailhead-helm move to them.
      test:
        description: Deprecated, use helm-unittest suites in the chart's tests/ folder. Bash run from the repo root after the lint and the default render, with the chart's folder in $CHART and its dependencies fetched. A failing command fails the job.
        type: string
        default: ''

permissions: {}

jobs:
  chart:
    name: Chart
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      CHART: ${{ inputs.chart }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          # Exact: with no version the action installs whatever Helm is newest
          # on the day. Renovate reads this input, and bumps it here and in
          # release.yml in one PR.
          version: v4.3.1
      # From the repositories the chart's Chart.yaml names, with no
      # `helm repo add`. Does nothing for a chart with no dependencies.
      - name: Fetch the chart's dependencies
        run: helm dependency update "$CHART"
      - name: Lint the chart
        run: helm lint "$CHART"
      - name: Render the chart with its defaults
        run: helm template "$CHART" >/dev/null
      # Every `*_test.yaml` in the chart's tests/ folder, with the
      # dependencies fetched above. helm-unittest's own image, at the Helm
      # minor this module installs. Renovate reads no image in a `run:`, so the
      # tag and digest change by hand, with the Helm minor. Run as
      # the runner's user, not as a `docker://` step: the tool makes a
      # `__snapshot__` folder beside the suites, which the image's own user
      # can't write in the checkout, and its cache goes in the container.
      - name: Run the chart's unit tests (helm-unittest)
        if: hashFiles(format('{0}/tests/**/*_test.yaml', inputs.chart)) != ''
        env:
          IMAGE: helmunittest/helm-unittest:4.3.0-1.2.1@sha256:28ea86c3e0b07f501f0c2e9c08b9f41e240f4a4b571cb5106b36cf0f0607e989
        run: >-
          docker run --rm --user "$(id -u):$(id -g)" -e HELM_CACHE_HOME=/tmp/helm
          -v "$PWD:/apps" -w /apps "$IMAGE" "$CHART"
      - name: Run the caller's renders
        if: inputs.test != ''
        env:
          TEST: ${{ inputs.test }}
        run: bash -euo pipefail -c "$TEST"
