name: terraform-github

# The github stack's plan and apply. On a PR that can change the stack,
# `terraform plan`, posted as one PR comment that each run updates (#8 step
# 6.5, decision record 0044). On the merge to main, the apply of that plan,
# and only if a fresh plan still matches the comment (#8 step 6.8, record
# 0045). An import's plan lists the repo's etag, which GitHub changes for
# every token, so its apply always refuses; TJ then starts this workflow by
# hand from main, and it applies without the comment check (record 0048). One
# workflow, so the token steps are written once. Not a required check: a
# path-filtered check never reports on other PRs.
on:
  pull_request:
    paths: &paths
      - .github/workflows/terraform-github.yml
      - terraform/**
      - repos/**
      - orgs/**
  push:
    branches: [main]
    paths: *paths
  workflow_dispatch:

# A new push to a PR replaces its running plan. Applies queue and are never
# cancelled, though a newer merge can replace one still waiting: that merge's
# plan then includes the replaced one's changes, so it no longer matches its
# comment and applies nothing (record 0045).
concurrency:
  group: terraform-github-${{ github.event.pull_request.number || 'apply' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  github:
    name: ${{ github.event_name == 'pull_request' && 'Plan' || 'Apply' }} github
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # On a PR, only this repo's own branches: a fork's PR gets no secrets
    # (record 0010). Dependabot's PRs plan too: a run Dependabot starts reads
    # the Dependabot secrets of the same names instead (docs/CICD.md). An
    # apply, pushed or started by hand, only ever from main.
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')
    permissions:
      contents: read
      pull-requests: write # the plan comment, and the apply's result on it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # An installation token reaches one owner only, so one per owner, each
      # minted for this run and gone within the hour. Write on a PR too: GitHub
      # hides a repo's merge settings from a token that can't change them, so
      # a read-only plan never matches the apply's (decision record 0047).
      # Each token reaches every repo of its owner, because the
      # stack manages them all, so zizmor's github-app audit is silenced on
      # each `owner:`. The App's client ID is public; only the private key is
      # a secret.
      - name: Token for zimmertr
        id: zimmertr
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: Iv23liwzT6dq3xtbxm5P
          private-key: ${{ secrets.YGGDRASIL_BOT_PRIVATE_KEY }}
          owner: zimmertr # zizmor: ignore[github-app]
          permission-administration: write
          permission-contents: write
          permission-metadata: read

      - name: Token for Bluebird-Forecast
        id: bluebird-forecast
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: Iv23liwzT6dq3xtbxm5P
          private-key: ${{ secrets.YGGDRASIL_BOT_PRIVATE_KEY }}
          owner: Bluebird-Forecast # zizmor: ignore[github-app]
          permission-administration: write
          permission-contents: write
          permission-metadata: read
          permission-organization-administration: write # the org settings (record 0051)

      - name: Token for Fellfield-Game
        id: fellfield-game
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: Iv23liwzT6dq3xtbxm5P
          private-key: ${{ secrets.YGGDRASIL_BOT_PRIVATE_KEY }}
          owner: Fellfield-Game # zizmor: ignore[github-app]
          permission-administration: write
          permission-contents: write
          permission-metadata: read
          permission-organization-administration: write # the org settings (record 0051)

      - name: Token for GPX-Search
        id: gpx-search
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: Iv23liwzT6dq3xtbxm5P
          private-key: ${{ secrets.YGGDRASIL_BOT_PRIVATE_KEY }}
          owner: GPX-Search # zizmor: ignore[github-app]
          permission-administration: write
          permission-contents: write
          permission-metadata: read
          permission-organization-administration: write # the org settings (record 0051)

      - name: Token for TJs-Kubernetes-Service
        id: tjs-kubernetes-service
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: Iv23liwzT6dq3xtbxm5P
          private-key: ${{ secrets.YGGDRASIL_BOT_PRIVATE_KEY }}
          owner: TJs-Kubernetes-Service # zizmor: ignore[github-app]
          permission-administration: write
          permission-contents: write
          permission-metadata: read
          permission-organization-administration: write # the org settings (record 0051)

      - name: Token for Lakebagger
        id: lakebagger
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: Iv23liwzT6dq3xtbxm5P
          private-key: ${{ secrets.YGGDRASIL_BOT_PRIVATE_KEY }}
          owner: Lakebagger # zizmor: ignore[github-app]
          permission-administration: write
          permission-contents: write
          permission-metadata: read
          permission-organization-administration: write # the org settings (record 0051)

      # dflook's actions run in their own image, and take Terraform's version
      # from the HCP workspace, not compose.yml (record 0044). The apply must
      # get the same variables as the plan, so both read them from one anchor.
      - name: Plan
        if: github.event_name == 'pull_request'
        uses: dflook/terraform-plan@738d3a75f0d801d280dca5eb7357b89c8383267f # v3.1.2
        env: &dflook-env
          # Not GITHUB_TOKEN, which the github provider would also read. The
          # apply finds the plan comment by this token's author.
          TERRAFORM_ACTIONS_GITHUB_TOKEN: ${{ github.token }}
          TERRAFORM_CLOUD_TOKENS: app.terraform.io=${{ secrets.TF_API_TOKEN }}
        with:
          path: terraform/github
          # The action sets TF_WORKSPACE to this, which must match the cloud
          # block's workspace name.
          workspace: github
          variables: &tf-variables |
            github_tokens = {
              "zimmertr"               = "${{ steps.zimmertr.outputs.token }}"
              "Bluebird-Forecast"      = "${{ steps.bluebird-forecast.outputs.token }}"
              "Fellfield-Game"         = "${{ steps.fellfield-game.outputs.token }}"
              "GPX-Search"             = "${{ steps.gpx-search.outputs.token }}"
              "TJs-Kubernetes-Service" = "${{ steps.tjs-kubernetes-service.outputs.token }}"
              "Lakebagger"             = "${{ steps.lakebagger.outputs.token }}"
            }

      # On a merge, plans again on main and applies only when that plan
      # matches the one in the merged PR's comment; otherwise it fails and
      # changes nothing. Started by hand, it applies main's plan as it is.
      - name: Apply
        if: github.event_name != 'pull_request'
        uses: dflook/terraform-apply@9fdc48d2744ee0528495a136ad2cd31ad8208a67 # v3.1.2
        env: *dflook-env
        with:
          path: terraform/github
          workspace: github
          variables: *tf-variables
          auto_approve: ${{ github.event_name == 'workflow_dispatch' }}
