name: release

# The release module: the next version; the caller's images built, pushed and
# scanned by digest; then the git tag and GitHub release, which wait on every
# scan; then a PR in each deploy repo that points it at the release. A caller
# runs it on every push to main, and may run it on PRs with `dry-run`, where it
# says in the job summary what the merge will release and builds the images
# without pushing them. Decision records 0027, 0032 and 0033.
#
# The caller sets `concurrency` (one release at a time) and grants
# `contents: write`, which only the Tag and Release job uses.
on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment the Tag and Release job runs in, for its protection rules. Empty for none.
        type: string
        default: ''
      dry-run:
        description: Work out the version and build the images, but push, tag and release nothing.
        type: boolean
        default: false
      images:
        description: >-
          JSON list of the images to build and push under the version, each
          {"image": "zimmertr/name", "context": ".", "file": "path/Dockerfile",
          "platforms": "linux/amd64,linux/arm64", "cache": true}. Only `image`
          is required. `context` defaults to the repo root, `file` (from the
          repo root) to the context's Dockerfile, `platforms` to linux/amd64,
          and `cache` to false. Empty for none.
        type: string
        default: '[]'
      deploys:
        description: >-
          JSON list of the files to point at the release, one PR each:
          {"repo": "zimmertr/Kubernetes-Manifests", "file": "path/kustomization.yml",
          "set": "yq path, such as .appVersion", "branch": "chore/name-image",
          "title": "chore(scope): bump name"}. The version is appended to the
          title as " to X.Y.Z". Empty for none.
        type: string
        default: '[]'
    secrets:
      dockerhub-username:
        description: Docker Hub user that pushes the images. Needed when `images` isn't empty.
        required: false
      dockerhub-token:
        description: Docker Hub token for that user. Needed when `images` isn't empty.
        required: false
      deploy-token:
        description: Token with contents and pull-requests write on every `deploys` repo. Needed when `deploys` isn't empty.
        required: false

permissions:
  contents: read

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tagged: ${{ steps.version.outputs.tagged }}
      scans: ${{ steps.scans.outputs.scans }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # GitVersion needs every commit and tag
          persist-credentials: false
      # A caller with its own GitVersion.yml uses it. Otherwise the module's
      # default, read at the commit the caller pinned (records 0006, 0022).
      - if: hashFiles('GitVersion.yml') == ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .yggdrasil
          persist-credentials: false
      # A PR's merge commit carries GitHub's message, not the PR title, so
      # GitVersion would misread it. Build the squash commit the merge will
      # make instead: the PR's changes on top of the base branch, titled with
      # the PR title. Staged changes only, so .yggdrasil stays out of it.
      - if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          MERGE=$(git rev-parse HEAD)
          git checkout -q -B "$BASE" "origin/$BASE"
          git merge -q --squash "$MERGE"
          git -c user.name=release -c user.email=release@localhost commit -q --allow-empty -m "$TITLE"
      # GitVersion's image rather than gittools/actions, so it sees only the
      # repo and none of the runner's GITHUB_* variables, which would make it
      # read a PR as a branch build. Dependabot doesn't see this pin: bump it
      # by hand.
      - id: version
        run: |
          CONFIG=GitVersion.yml
          [ -f "$CONFIG" ] || CONFIG=.yggdrasil/defaults/GitVersion.yml
          VERSION=$(docker run --rm -v "$PWD:/repo" \
            gittools/gitversion:6.8.2@sha256:f10e8320b2cf86f879a9304e074ac11f16b897380e0e4a86dd39682b265da568 \
            /repo /config "/repo/$CONFIG" /nocache /output json /format '{SemVer}' | tail -n 1)
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::GitVersion gave '${VERSION}'"; exit 1; }
          TAGGED=false
          git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null && TAGGED=true
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tagged=${TAGGED}" >> "$GITHUB_OUTPUT"
          # A merge that touches nothing GitVersion counts gives back the last
          # tagged version, which is how a settings-only merge releases nothing.
          if [ "$TAGGED" = true ]; then
            echo "Releases nothing: v${VERSION} is already tagged." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "Releases v${VERSION}." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      # One scan per image and platform, since Trivy reads one platform of an
      # index at a time.
      - id: scans
        env:
          IMAGES: ${{ inputs.images }}
        run: |
          echo "scans=$(jq -c '[.[] | .image as $i | (.platforms // "linux/amd64" | split(",")[]) | {image: $i, platform: .}]' <<< "$IMAGES")" >> "$GITHUB_OUTPUT"

  build:
    name: Build & Push (${{ matrix.image }})
    needs: version
    # A dry run builds every image as a test. A real run builds only on main,
    # for a version not yet tagged.
    if: inputs.images != '[]' && (inputs.dry-run || (github.ref == 'refs/heads/main' && needs.version.outputs.tagged == 'false'))
    runs-on: ubuntu-latest
    # Releases run one at a time, so a hung push would hold every later merge
    # until GitHub's six-hour default.
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      matrix:
        include: ${{ fromJSON(inputs.images) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # arm64 and any other platform the runner can't run natively.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      # The docker-container driver, which the attestations need.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: ${{ !inputs.dry-run }}
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.dockerhub-username }}
          password: ${{ secrets.dockerhub-token }}
      # A re-run after a failure past the push finds the image there. It must
      # have been built from this commit, or the tag would name source the image
      # doesn't hold. Each commit has its own version, so a mismatch is never a
      # re-run, and stops here.
      - name: Check whether the image is already pushed
        id: pushed
        if: ${{ !inputs.dry-run }}
        env:
          IMAGE: ${{ matrix.image }}:${{ needs.version.outputs.version }}
        run: |
          if ! docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # `.Image` is a map keyed by platform only when the index holds more
          # than one (hevy-trainer-sync#33). jq takes either shape.
          REV=$(docker buildx imagetools inspect "$IMAGE" --format '{{ json .Image }}' \
            | jq -r 'if has("linux/amd64") then .["linux/amd64"] else . end
                     | .config.Labels["org.opencontainers.image.revision"] // empty')
          if [ "$REV" != "$GITHUB_SHA" ]; then
            echo "::error::${IMAGE} was built from ${REV:-an unknown commit}, not ${GITHUB_SHA}."
            exit 1
          fi
          echo "exists=true" >> "$GITHUB_OUTPUT"
          echo "${IMAGE} is already pushed from this commit; skipping the build."
      - id: stamp
        run: echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - if: steps.pushed.outputs.exists != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context || '.' }}
          file: ${{ matrix.file || '' }}
          platforms: ${{ matrix.platforms || 'linux/amd64' }}
          push: ${{ !inputs.dry-run }}
          # The version only. No `latest`: deploys pin the version, and a
          # moving tag is one nothing should pull.
          tags: ${{ matrix.image }}:${{ needs.version.outputs.version }}
          # The names hevy-trainer-sync and Bluebird read. An image that uses
          # none of them builds the same, with a warning.
          build-args: |
            APP_VERSION=${{ needs.version.outputs.version }}
            APP_COMMIT=${{ github.sha }}
            APP_BUILT_AT=${{ steps.stamp.outputs.built_at }}
          # The revision label is what the re-run check above reads.
          labels: |
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          provenance: mode=max
          sbom: true
          cache-from: ${{ matrix.cache && 'type=gha' || '' }}
          cache-to: ${{ matrix.cache && 'type=gha,mode=max' || '' }}

  # What the registry holds, scanned before anything points at it: the PR scan
  # saw only an amd64 build of the PR branch. By digest, so the bytes scanned
  # are the bytes pushed. No Docker Hub login, so Trivy's code sees no
  # credential. A finding holds the tag and release back; the image stays
  # pushed, and the fix is the next release.
  scan:
    name: Scan Pushed Image (${{ matrix.image }}, ${{ matrix.platform }})
    needs: [version, build]
    if: ${{ !inputs.dry-run && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      # Report every image and platform even when one fails.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.version.outputs.scans) }}
    steps:
      # Only for the scan settings: the caller's trivy.yaml, or the module's
      # default (records 0006, 0022).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: hashFiles('trivy.yaml') == ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .yggdrasil
          persist-credentials: false
      # Docker Hub's tags are immutable (record 0024), so the digest under the
      # version is the one the build pushed.
      - id: ref
        env:
          IMAGE: ${{ matrix.image }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          DIGEST=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{ .Manifest.Digest }}')
          TRIVY=trivy.yaml
          [ -f "$TRIVY" ] || TRIVY=.yggdrasil/defaults/trivy.yaml
          {
            echo "ref=${IMAGE}@${DIGEST}"
            echo "trivy=${TRIVY}"
          } >> "$GITHUB_OUTPUT"
      - name: Scan the image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: ${{ matrix.platform }}
        with:
          image-ref: ${{ steps.ref.outputs.ref }}
          format: json
          output: trivy.json
          ignore-unfixed: true
          trivy-config: ${{ steps.ref.outputs.trivy }}
      - name: Fail on fixable Critical or High vulnerabilities
        env:
          IMAGE: ${{ matrix.image }}:${{ needs.version.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          # `?` on both levels: a report with no results is the clean case.
          COUNT=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL" or .Severity == "HIGH")] | length' trivy.json)
          if [ "$COUNT" -gt 0 ]; then
            trivy convert --format table trivy.json >> "$GITHUB_STEP_SUMMARY"
            echo "::error::${COUNT} fixable Critical/High vulnerabilities in ${IMAGE} (${PLATFORM}). No tag or release; the fix is the next release."
            exit 1
          fi
          echo "No fixable Critical/High vulnerabilities in ${IMAGE} (${PLATFORM})." >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Tag and Release
    needs: [version, build, scan]
    # Main only: a release from any other ref would tag that ref. With no
    # images, build and scan are skipped, which is fine; a failure in either
    # stops it.
    if: ${{ !cancelled() && !failure() && !inputs.dry-run && github.ref == 'refs/heads/main' && needs.version.outputs.tagged == 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ${{ inputs.environment }}
    permissions:
      contents: write  # the tag and the release
    steps:
      # One call makes the tag at this commit and the release, with notes from
      # the merged PR titles. No checkout, so no credential sits on disk.
      - env:
          TAG: v${{ needs.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          echo "Released ${TAG}." >> "$GITHUB_STEP_SUMMARY"

  # One PR per deploy file, on a fixed branch, so quick releases leave one
  # up-to-date PR, not a pile. After the release, because a chart repo's own
  # release reads the app's latest one.
  deploy:
    name: Deploy Bump (${{ matrix.repo }})
    needs: [version, release]
    if: inputs.deploys != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read  # the release list, for the newer-release check
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.deploys) }}
    steps:
      # A re-run that finishes an older release after a newer one shipped must
      # not move the deploy back onto the older version. Every tag sorted by
      # version, since GitHub's Latest is whichever release came last.
      - id: newest
        env:
          VERSION: ${{ needs.version.outputs.version }}
          REPO: ${{ matrix.repo }}
          GH_TOKEN: ${{ github.token }}
        run: |
          NEWEST=$(gh release list --repo "$GITHUB_REPOSITORY" --json tagName --jq '.[].tagName' | sed 's/^v//' | sort -V | tail -n 1)
          [ "$NEWEST" = "$VERSION" ] || echo "::notice::v${NEWEST} is newer than v${VERSION}; leaving ${REPO} alone."
          echo "newest=${NEWEST}" >> "$GITHUB_OUTPUT"
      - if: steps.newest.outputs.newest == needs.version.outputs.version
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.repo }}
          token: ${{ secrets.deploy-token }}
          persist-credentials: false
      # yq's own action, its image pinned by digest. -e fails the step when the
      # path matches nothing, which would otherwise pass for a deploy already
      # at this version.
      - if: steps.newest.outputs.newest == needs.version.outputs.version
        uses: mikefarah/yq@504fc38780cc46be8444ea1b72fb55919fc0bfb0 # v4.54.1
        env:
          VERSION: ${{ needs.version.outputs.version }}
          FILE: ${{ matrix.file }}
          SET: ${{ matrix.set }}
        with:
          cmd: yq -i "$SET = strenv(VERSION)" "$FILE" && yq -e "($SET) == strenv(VERSION)" "$FILE"
      # Pushes the fixed branch fresh off the default branch, then opens the PR
      # or edits the open one to this version. Does nothing when the file
      # already holds it. zizmor would have `gh pr create` instead, which does
      # only the last of those; the rest would be shell (record 0033).
      - id: pr  # zizmor: ignore[superfluous-actions]
        if: steps.newest.outputs.newest == needs.version.outputs.version
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.deploy-token }}
          branch: ${{ matrix.branch }}
          commit-message: ${{ matrix.title }} to ${{ needs.version.outputs.version }}
          title: ${{ matrix.title }} to ${{ needs.version.outputs.version }}
          body: |
            Automated by the ${{ github.repository }} v${{ needs.version.outputs.version }} release.

            - Release: ${{ github.server_url }}/${{ github.repository }}/releases/tag/v${{ needs.version.outputs.version }}
      # Every push to the branch disarms auto-merge, so arm it each time. The
      # plain merge covers checks already green, where --auto is refused.
      - if: steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation == 'updated'
        env:
          REPO: ${{ matrix.repo }}
          PR: ${{ steps.pr.outputs.pull-request-number }}
          GH_TOKEN: ${{ secrets.deploy-token }}
        run: gh pr merge "$PR" --repo "$REPO" --auto --squash || gh pr merge "$PR" --repo "$REPO" --squash
