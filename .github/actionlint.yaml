# actionlint 1.7.12 predates two GitHub features this repo uses: the
# job.workflow_repository and job.workflow_sha contexts, which a module uses to
# read its own files (decision record 0022), and `uses: $/...` for this repo at
# the running commit (GitHub, 2026-07-30). Drop each line once an actionlint
# release knows it.
paths:
  .github/workflows/**/*.yml:
    ignore:
      - 'property "workflow_(repository|sha)" is not defined'
      - 'reusable workflow call "\$/'
