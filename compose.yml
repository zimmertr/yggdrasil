# The tool images every make target runs in, pinned by tag and digest. They
# live here, not in the Makefile, so Renovate's docker-compose updates can
# move them. CI runs the same targets, so local and CI runs use one image set.
services:
  actionlint:
    image: rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
    volumes:
      - .:/repo
    working_dir: /repo

  zizmor:
    image: ghcr.io/zizmorcore/zizmor:1.32.0@sha256:3014cc8f68f663935f69b3c3e0e41f5ce102b268d97db13db0f62208747f860d
    volumes:
      - .:/repo
    working_dir: /repo
    # Passed through when set: CI sets it, so zizmor also runs its online
    # audits (known vulnerable actions, impostor commits). Unset, it runs offline.
    environment:
      - GH_TOKEN

  semgrep:
    image: semgrep/semgrep:1.184.0@sha256:cc1b68266f267878b39739373ea9985b9a78e5d64497dd875c8de100b22695ed
    volumes:
      - .:/repo
    working_dir: /repo

  lychee:
    image: lycheeverse/lychee:0.24.2@sha256:e2d19e57cf6ab037026f20b8e449a1f30d9d7f81eef4194763aab2eab20bd28d
    volumes:
      - .:/repo
    working_dir: /repo

  # The terraform module's fmt, validate and test (decision record 0042).
  terraform:
    image: hashicorp/terraform:1.17.1@sha256:a5d5a5a892c98f60fcbfa81eac2a40fc19e7b3fa7719bccae10ff6111d22524a
    volumes:
      - .:/repo
    working_dir: /repo
    environment:
      - TF_IN_AUTOMATION=1
      # Working files in the container, not the checkout, so a run leaves no
      # providers behind for the docs checks to read.
      - TF_DATA_DIR=/tmp/terraform

  tflint:
    image: ghcr.io/terraform-linters/tflint:v0.66.0@sha256:65b9944a9274c4989492c1d79998c2801664bf8a55fddb4bd3a9e6d73a006ddc
    volumes:
      - .:/repo
    working_dir: /repo

  trivy:
    image: ghcr.io/aquasecurity/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
    volumes:
      - .:/repo
    working_dir: /repo

  # Debian, not Alpine: BusyBox's grep has no --include or --exclude-dir.
  shell:
    image: debian:13-slim@sha256:a72b4433de1cf7d6bae0c4cee74d0547f58601a643b3375f070c51600d63b6b2
    volumes:
      - .:/repo
    working_dir: /repo
