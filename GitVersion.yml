workflow: GitHubFlow/v1
# yggdrasil's own version, the one SemVer every module shares (decision record
# 0004). hevy-trainer-sync's file, with the same seed. Mainline alone ignores
# next-version, so ConfiguredNextVersion makes the first release v0.1.0; once
# that tag exists Mainline counts from it and the seed stops mattering. The seed
# carries the tag prefix because GitVersion 6.8.2 refuses a bare `0.1.0`.
strategies:
  - ConfiguredNextVersion
  - Mainline
next-version: 'v0.1.0'
# Only a commit that touches a module path releases (decision record 0004).
# GitVersion skips a commit when every path it changes matches this pattern,
# which matches any path outside .github/workflows/, actions/ and defaults/,
# other than compose.yml, whose tool images the lint module runs (record
# 0037). A commit that touches a module and anything else still counts, `!`
# and all.
# yggdrasil's own CI lives in .github/workflows/ too, so a CI-only change
# releases a patch.
#
# With the newest commits skipped, GitVersion's `Sha` output is the last module
# commit, not HEAD. When nothing new counted, the version is one already tagged,
# so #4's release job skips any version whose tag exists.
ignore:
  paths:
    - '^(?!(\.github/workflows|actions|defaults)/|compose\.yml$)'
tag-prefix: 'v'
branches:
  main:
    mode: ContinuousDeployment
# Bluebird's patterns, unchanged. The squash commit's title is the PR title, so
# these read the title and nothing else. Without `(?m)`, `^` is the start of the
# whole message, so a body line never cuts a major. GitVersion matches without
# regard to case. The scope is `[^)\r\n]+` so `fix(x): explain feat(y)!:` stays a
# patch. `build` is for Dependabot's `build(deps):` titles.
#
# The PR Title job (.github/workflows/pr-title.yml) allows exactly these types.
# A type added here is added there in the same PR, or titles using it fail the
# check; a type the check allows but these patterns miss would release a patch.
major-version-bump-message: '^(feat|fix|perf|refactor|chore|docs|style|test|ci|build)(\([^)\r\n]+\))?!:'
minor-version-bump-message: '^feat(\([^)\r\n]+\))?:'
patch-version-bump-message: '^(fix|perf|refactor|chore|docs|style|test|ci|build)(\([^)\r\n]+\))?:'
