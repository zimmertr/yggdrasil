version: 2
# Every title is `build(deps): ...`, which the PR Title check and GitVersion
# read as a patch. Patch and minor version updates merge themselves
# (dependabot-auto-merge.yml); majors wait for TJ. Decision record 0021.
#
# Each update waits seven days after its release before Dependabot proposes it,
# so a compromised release has a week to be noticed and pulled before it can
# merge itself here. Security updates don't wait: GitHub applies cooldown to
# version updates only.
updates:
  # Every action is pinned to a commit SHA with its version in a comment.
  # Dependabot reads the comment, proposes the next release, and rewrites both.
  # Composite actions under actions/ get their own directory entry when #4
  # adds the first one.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope

  # The providers each stack's .terraform.lock.hcl pins. These never merge
  # themselves (dependabot-auto-merge.yml skips them): once a merge applies the
  # stack (#8), a provider bump changes what the next apply does, so TJ reads
  # its plan first.
  - package-ecosystem: terraform
    directories:
      - /terraform/*
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope

  # The tool images in compose.yml, pinned by tag and digest (decision record
  # 0018). A rebuild under the same tag arrives as a digest-only PR.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
