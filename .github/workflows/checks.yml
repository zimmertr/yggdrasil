name: checks

# The PR checks, each through the make target and container a local run uses
# (decision records 0018 and 0019).
#
# Branch protection requires the job names `actionlint`, `zizmor` and `Docs`;
# renaming one strands PRs on a check that never reports.
on:
  pull_request:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make actionlint

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The job's read-only token turns on zizmor's online audits.
      - run: make zizmor ZIZMOR_ARGS=--format=github
        env:
          GH_TOKEN: ${{ github.token }}

  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make docs
