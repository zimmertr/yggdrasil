# The tool images every make target runs in, pinned by tag and digest. They
# live here, not in the Makefile, so Dependabot's docker-compose updates can
# move them. CI runs the same targets, so local and CI runs use one image set.
services:
  python:
    image: python:3.13-slim@sha256:09a17cad02668ae61ece136b4fd36ac3849e14f670ebedb637ea3e15580525bc
    volumes:
      - .:/repo
    working_dir: /repo
    environment:
      PIP_ROOT_USER_ACTION: ignore
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

  ruff:
    image: ghcr.io/astral-sh/ruff:0.17.4@sha256:c4b7e7a87e4b07d66b569dd2e6b2ce5a25e38be91dd664dc49b9882be27acd9b
    volumes:
      - .:/repo
    working_dir: /repo

  actionlint:
    image: rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
    volumes:
      - .:/repo
    working_dir: /repo
