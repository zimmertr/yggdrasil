workflow: GitHubFlow/v1
# The version rules a caller of the release module gets unless it passes its
# own file (decision record 0006). The module reads this file at its pinned
# commit (record 0022). It is yggdrasil's root GitVersion.yml without the
# `ignore` rule: that rule names yggdrasil's module paths, and in a caller every
# merge to main releases.
#
# Mainline alone ignores next-version, so ConfiguredNextVersion makes a repo's
# first release v0.1.0. Once a tag exists Mainline counts from it, and the seed
# stops mattering even in a repo already past v1. The seed carries the tag
# prefix because GitVersion 6.8.2 refuses a bare `0.1.0`.
strategies:
  - ConfiguredNextVersion
  - Mainline
next-version: 'v0.1.0'
tag-prefix: 'v'
branches:
  main:
    mode: ContinuousDeployment
# Bluebird's patterns, unchanged. The squash commit's title is the PR title, so
# these read the title and nothing else. Without `(?m)`, `^` is the start of the
# whole message, so a body line never cuts a major. GitVersion matches without
# regard to case. The scope is `[^)\r\n]+` so `fix(x): explain feat(y)!:` stays a
# patch. `build` is for Dependabot's `build(deps):` titles.
#
# A title no pattern matches still releases a patch, through the branch's
# default increment. The pr-title module allows exactly these types, so every
# type in use must be named here.
major-version-bump-message: '^(feat|fix|perf|refactor|chore|docs|style|test|ci|build)(\([^)\r\n]+\))?!:'
minor-version-bump-message: '^feat(\([^)\r\n]+\))?:'
patch-version-bump-message: '^(fix|perf|refactor|chore|docs|style|test|ci|build)(\([^)\r\n]+\))?:'
