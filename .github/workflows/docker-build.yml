name: docker-build

# The PR image module: hadolint, then the linux/amd64 image the release would
# ship, built but not pushed, scanned by Trivy, tested with the caller's
# container-structure-test file (or, deprecated, its smoke test), and refused
# on any fixable Critical or High. hevy-trainer-sync's and Bluebird's Docker
# Build job. Decision records 0030, 0034 and 0060.
#
# The caller runs it on `pull_request` and grants `contents: read` and
# `pull-requests: write`, for the sticky scan comment.
on:
  workflow_call:
    inputs:
      context:
        description: Build context, holding the Dockerfile.
        type: string
        default: .
      build-args:
        description: Build arguments, one KEY=value per line.
        type: string
        default: ''
      structure-test:
        description: A container-structure-test file, from the repo root, run against the built image. Any failing test fails the job.
        type: string
        default: ''
      # Deprecated (record 0060): an image's checks are a container-structure-test
      # file. Removed in a major once bluebird and Mountaineers-Activity-Scraper move.
      smoke-test:
        description: Deprecated, use structure-test. Bash run against the built image, whose tag is in $IMAGE (`<repo name>:pr-scan`). A failing command fails the job.
        type: string
        default: ''
      cache:
        description: Use the GitHub Actions layer cache.
        type: boolean
        default: false
      upload-image:
        description: Save the image as the artifact `<repo name>-image`, holding `<repo name>-image.tar`, for the caller's later jobs to load.
        type: boolean
        default: false

permissions: {}

jobs:
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write # the sticky scan comment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A caller with its own trivy.yaml uses it. Otherwise the module's
      # default, read at the commit the caller pinned (records 0006, 0022).
      - if: hashFiles('trivy.yaml') == ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .yggdrasil
          persist-credentials: false
      # Docker tags must be lowercase; repo names needn't be.
      - id: names
        run: |
          REPO=${GITHUB_REPOSITORY#*/}
          echo "image=${REPO,,}:pr-scan" >> "$GITHUB_OUTPUT"

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: ${{ inputs.context }}/Dockerfile
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The platform the cluster runs. Loaded into the runner's daemon so Trivy
      # can scan it and the smoke test can run it; nothing is pushed.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ steps.names.outputs.image }}
          build-args: ${{ inputs.build-args }}
          cache-from: ${{ inputs.cache && 'type=gha' || '' }}
          cache-to: ${{ inputs.cache && 'type=gha,mode=max' || '' }}

      - if: inputs.upload-image
        env:
          IMAGE: ${{ steps.names.outputs.image }}
          REPO: ${{ github.event.repository.name }}
        run: docker save "$IMAGE" -o "$RUNNER_TEMP/${REPO}-image.tar"
      - if: inputs.upload-image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ github.event.repository.name }}-image
          path: ${{ runner.temp }}/${{ github.event.repository.name }}-image.tar
          retention-days: 1
          # The layers are already compressed.
          compression-level: 1

      # Fixable only: distributions ship CVEs upstream hasn't patched, which
      # nobody can act on. Every severity, for the comment.
      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.names.outputs.image }}
          output: trivy.txt
          ignore-unfixed: true
          trivy-config: ${{ hashFiles('trivy.yaml') != '' && 'trivy.yaml' || '.yggdrasil/defaults/trivy.yaml' }}
      - env:
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          {
            echo "### Image vulnerability scan"
            echo ""
            echo "Trivy on this PR's image at \`${PR_SHA}\` (linux/amd64, fixable only). Critical and High fail this check, and the release would refuse them too."
            echo ""
            echo '```text'
            cat trivy.txt
            echo '```'
          } > scan-comment.md
          cat scan-comment.md >> "$GITHUB_STEP_SUMMARY"
      # Edited in place on every push. Skipped for Dependabot: its runs get a
      # read-only token, so the step summary above is its only surface.
      - if: github.event.pull_request.user.login != 'dependabot[bot]'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: image-scan
          path: scan-comment.md

      # The tool's own image, pinned by digest; Renovate moves it (record
      # 0060). The step gets the runner's Docker socket, so it finds the image
      # loaded above.
      - name: Test the built image (container-structure-test)
        if: inputs.structure-test != ''
        uses: docker://ghcr.io/googlecontainertools/container-structure-test:1.22.1@sha256:710da3ca8ed29a42423315592f74f02df4e3d2ba19f1df7257bd481ea75ba5aa
        with:
          entrypoint: /ko-app/container-structure-test
          args: test --image ${{ steps.names.outputs.image }} --config ${{ inputs.structure-test }}

      - name: Smoke test the built image
        if: inputs.smoke-test != ''
        env:
          IMAGE: ${{ steps.names.outputs.image }}
          SMOKE_TEST: ${{ inputs.smoke-test }}
        run: bash -euo pipefail -c "$SMOKE_TEST"

      # The gate, after the comment so a red run still explains itself. The
      # same scan again, from the first run's cache.
      - name: Fail on fixable Critical or High vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.names.outputs.image }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          skip-setup-trivy: true
          trivy-config: ${{ hashFiles('trivy.yaml') != '' && 'trivy.yaml' || '.yggdrasil/defaults/trivy.yaml' }}
