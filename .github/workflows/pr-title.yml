name: PR Title

# The PR title becomes the squash commit's title, and that line alone picks the
# release bump (scripts/version.sh). This refuses a title the release can't
# read, before the merge rather than after it. Decision records 0020 and 0067.
#
# A workflow of its own, because it must run when only the title changes
# (`edited`). `synchronize` stays in the list because a check reports against
# the head commit, so a push with no run of its own would carry no result.
#
# Branch protection requires the job name `PR Title`; renaming it strands PRs
# on a check that never reports.
#
# `pull_request`, not `pull_request_target`: a fork's run gets a read-only
# token and no secrets, and this job needs neither.
#
# Also the pr-title module: other repos call this file with `workflow_call`
# from a job on the same four `pull_request` types, and see the check as
# `<caller job> / PR Title`. Decision record 0028.
#
# No `concurrency` group. Renovate pushes a branch and edits its PR at once,
# which starts two runs on the same commit. A group would cancel one, and
# Renovate reads a cancelled run as pending forever, so it never merges
# (docs/DATA.md). The job takes seconds, so cancelling saved nothing, and
# zizmor's pedantic concurrency-limits is ignored here for that reason.
on: # zizmor: ignore[concurrency-limits]
  pull_request:
    types: [opened, edited, reopened, synchronize]
  workflow_call:

permissions: {}

jobs:
  title:
    name: PR Title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read # the PR's current title
    steps:
      # The script that reads the title at release, at the commit the caller
      # pinned (record 0022).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .yggdrasil
          sparse-checkout: scripts
          persist-credentials: false
      # From the API, not the event, so a re-run checks the title as it is now.
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          title=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .title)
          .yggdrasil/scripts/version.sh check "$title"
