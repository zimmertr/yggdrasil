name: checks

# The PR checks, in the containers a local run uses (decision records 0018 and
# 0019). The lint module runs here on this repo, from this PR's own copy, so
# every change to it is tested before it releases (record 0037).
#
# Branch protection requires the five `Lint /` checks and the five
# `Terraform /` checks; renaming a job strands PRs on a check that never
# reports.
on:
  pull_request:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    uses: $/.github/workflows/lint.yml
    permissions:
      contents: read

  # The terraform module, on this repo's stacks under terraform/ (record 0042).
  terraform:
    name: Terraform
    uses: $/.github/workflows/terraform.yml
    with:
      # The same list the Makefile's TF_DIRS holds.
      directories: terraform/github terraform/cloudflare terraform/modules/repo terraform/modules/org
    permissions:
      contents: read

  # The dependency-review module on this repo's own PRs, from this PR's copy.
  # Not required yet: #133 step 10 adds it with the other repos' checks.
  dependency-review:
    name: Dependency Review
    uses: $/.github/workflows/dependency-review.yml
    permissions:
      contents: read
