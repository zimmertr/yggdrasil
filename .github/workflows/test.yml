name: test

# The suite, including the policy check (scripts/check_policy.py), on every PR.
# It runs through `make test`, in the same container a local run uses.
# workflow_call lets the release workflow (#4) test the merged commit first.
#
# Branch protection will require the job name `test`; renaming it strands PRs
# on a check that never reports.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make test
      # Line and branch coverage with no floor. The table also goes to the
      # run's summary, so a gap shows on the PR.
      - run: make -s coverage-summary >> "$GITHUB_STEP_SUMMARY"
