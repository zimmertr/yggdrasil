name: lighthouse

# The lighthouse module: Lighthouse CI against the image the docker-build
# module built for this PR. It loads the `<repo name>-image` artifact that
# docker-build saves with `upload-image: true`, serves it on the caller's
# port, waits for its health path, and audits it with the caller's Lighthouse
# CI config, which holds the URLs and the budgets. Decision record 0065.
#
# treosh/lighthouse-ci-action runs Lighthouse with the runner's own Chrome,
# not in a container: Lighthouse CI advises against its Docker image wherever
# Chrome can be installed directly, because a container makes timings noisier.
#
# The caller runs it from a job with `needs:` on its docker-build job, grants
# `contents: read`, and sees `<caller job> / Lighthouse`.
on:
  workflow_call:
    inputs:
      config:
        description: The Lighthouse CI config, from the repo root, such as `.github/lighthouserc.js`. It names the URLs to audit, on localhost and the port below, and the assertions.
        type: string
        required: true
      port:
        description: The port the image listens on, published on the runner's localhost.
        type: number
        required: true
      health-path:
        description: A path that answers 2xx once the app is up, waited on for up to 30 seconds before the audit.
        type: string
        default: /

permissions: {}

jobs:
  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ github.event.repository.name }}-image
      # The name and tag docker-build gave the image: the repo name,
      # lowercased, at `pr-scan`.
      - name: Serve the image
        env:
          REPO: ${{ github.event.repository.name }}
          PORT: ${{ inputs.port }}
          HEALTH_PATH: ${{ inputs.health-path }}
        run: |
          docker load -i "${REPO}-image.tar"
          docker run -d --rm -p "${PORT}:${PORT}" "${REPO,,}:pr-scan"
          curl -fsS --retry 30 --retry-delay 1 --retry-connrefused -o /dev/null "http://localhost:${PORT}${HEALTH_PATH}"
      # The reports land in the run's artifacts, so a failure can be read.
      # Nothing is uploaded off GitHub.
      - uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # 12.6.2
        with:
          configPath: ${{ inputs.config }}
          uploadArtifacts: true
          temporaryPublicStorage: false
