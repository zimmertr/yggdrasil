name: checks

# The PR checks, in the containers a local run uses (decision records 0018 and
# 0019). The lint module runs here on this repo, from this PR's own copy, so
# every change to it is tested before it releases (record 0037).
#
# Branch protection requires `Lint / actionlint`, `Lint / zizmor`, `Lint / semgrep`, the five
# `Terraform /` checks and `Docs`;
# renaming a job strands PRs on a check that never reports.
on:
  pull_request:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    uses: $/.github/workflows/lint.yml
    permissions:
      contents: read

  # The terraform module, on this repo's stacks under terraform/ (record 0042).
  terraform:
    name: Terraform
    uses: $/.github/workflows/terraform.yml
    with:
      # The same list the Makefile's TF_DIRS holds.
      directories: terraform/github terraform/modules/repo
    permissions:
      contents: read

  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make docs
