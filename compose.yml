# The tool images every make target runs in, pinned by tag and digest. They
# live here, not in the Makefile, so Dependabot's docker-compose updates can
# move them. CI runs the same targets, so local and CI runs use one image set.
services:
  actionlint:
    image: rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
    volumes:
      - .:/repo
    working_dir: /repo

  zizmor:
    image: ghcr.io/zizmorcore/zizmor:1.32.0@sha256:3014cc8f68f663935f69b3c3e0e41f5ce102b268d97db13db0f62208747f860d
    volumes:
      - .:/repo
    working_dir: /repo
    # Passed through when set: CI sets it, so zizmor also runs its online
    # audits (known vulnerable actions, impostor commits). Unset, it runs offline.
    environment:
      - GH_TOKEN

  lychee:
    image: lycheeverse/lychee:0.24.2@sha256:e2d19e57cf6ab037026f20b8e449a1f30d9d7f81eef4194763aab2eab20bd28d
    volumes:
      - .:/repo
    working_dir: /repo

  # The engine yggdrasil's releases run. The image ships git and bash, so the
  # GitVersion Engine test builds its made-up histories in it too. Read-only:
  # the test writes only to its own temporary directory.
  gitversion:
    image: gittools/gitversion:6.8.2@sha256:f10e8320b2cf86f879a9304e074ac11f16b897380e0e4a86dd39682b265da568
    volumes:
      - .:/repo:ro
    working_dir: /repo

  # Debian, not Alpine: BusyBox's grep has no --include or --exclude-dir.
  shell:
    image: debian:13-slim@sha256:a72b4433de1cf7d6bae0c4cee74d0547f58601a643b3375f070c51600d63b6b2
    volumes:
      - .:/repo
    working_dir: /repo
