name: Dependabot auto-merge

# Patch and minor Dependabot version updates merge themselves once main's
# required checks pass. Majors, and digest-only image updates, wait for TJ.
# Bluebird's and hevy-trainer-sync's workflow, with one change: the merge is
# armed with a token minted from the App zimmertr-yggdrasil-bot, not a PAT.
# Decision records 0007 and 0021.
#
# Why the App: a merge made with GITHUB_TOKEN starts no `on: push` workflow, so
# a module bump would merge without releasing. A merge by the App does start
# them, and with the Workflows permission it can merge a bump that edits
# .github/workflows.
on: pull_request

permissions: {}

jobs:
  auto-merge:
    name: Auto-merge patch and minor updates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The PR's author, not github.actor: the actor is whoever last triggered the
    # run, and can be someone else re-running Dependabot's PR.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      pull-requests: read # fetch-metadata reads the PR and its commits
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ github.token }}

      # The App's client ID is public; only the private key is a secret. It is
      # a Dependabot secret, because a run Dependabot starts can't read Actions
      # secrets. The token is scoped to this repo and to what a merge needs.
      - name: Mint a token from zimmertr-yggdrasil-bot
        if: contains(fromJSON('["version-update:semver-patch", "version-update:semver-minor"]'), steps.metadata.outputs.update-type)
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: Iv23liwzT6dq3xtbxm5P
          private-key: ${{ secrets.YGGDRASIL_BOT_PRIVATE_KEY }}
          repositories: yggdrasil
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      # Squash, the only merge this repo allows. GitHub completes it once the
      # required checks pass and every conversation is resolved.
      - name: Enable auto-merge
        if: steps.app-token.outcome == 'success'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      # Say so on the PR, as the bot. Marker-guarded: Dependabot's rebases rerun
      # this job, and reruns must not stack duplicate comments.
      - name: Comment that auto-merge is armed
        if: steps.app-token.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          MARKER='<!-- yggdrasil-auto-merge -->'
          if gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --paginate \
              --jq '.[].body' | grep -qF "$MARKER"; then
            exit 0
          fi
          BODY=$(printf '%s\n' \
            "$MARKER" \
            "### Auto-merge armed" \
            "" \
            "This is a patch or minor update, so it merges itself once the required checks pass and its conversations are resolved. Major updates wait for review." \
            "" \
            "To stop it, run \`gh pr merge --disable-auto\` on this PR, or close it.")
          gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" -f body="$BODY" >/dev/null
