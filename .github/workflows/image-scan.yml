name: image-scan

# The weekly rescan module. The release scan gates what ships, but CVEs are
# published after an image ships, and the running image rots while nothing
# rebuilds it. This scans each image at the caller's latest release, sends the
# findings to the Security tab, and fails, which emails TJ, only when a fixable
# Critical or High exists. hevy-trainer-sync's and Bluebird's Scheduled Image
# Scan. Decision records 0031 and 0034.
#
# The caller runs it on a `schedule` (and `workflow_dispatch`) and grants
# `contents: read` and `security-events: write`.
on:
  workflow_call:
    inputs:
      images:
        description: >-
          JSON list of the images to scan, each {"image": "zimmertr/name",
          "category": "the Security tab category", "remedy": "optional words
          for the failure message"}. A category that stays the same keeps its
          alert history.
        type: string
        required: true

permissions: {}

jobs:
  scan:
    name: Scan released image (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # the SARIF upload
    strategy:
      # Report every image even when one fails, so one look covers them all.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.images) }}
    steps:
      # Only for the scan settings: the caller's trivy.yaml, or the module's
      # default at the commit the caller pinned (records 0006, 0022), the same
      # file the PR and release scans read.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: hashFiles('trivy.yaml') == ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .yggdrasil
          persist-credentials: false

      - name: Resolve the latest release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ matrix.image }}
        run: echo "ref=${IMAGE}:$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq '.tagName | ltrimstr("v")')" >> "$GITHUB_OUTPUT"

      # Fixable only, as the PR and release scans, every severity to the
      # Security tab. The tag names an index holding every platform and the
      # attestations; TRIVY_PLATFORM reads the cluster's.
      - name: Scan the image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/amd64
        with:
          image-ref: ${{ steps.release.outputs.ref }}
          format: sarif
          output: trivy.sarif
          ignore-unfixed: true
          trivy-config: ${{ hashFiles('trivy.yaml') != '' && 'trivy.yaml' || '.yggdrasil/defaults/trivy.yaml' }}

      - name: Upload results to the Security tab
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy.sarif
          category: ${{ matrix.category }}

      # The same scan again, from the first run's cache, as the gate.
      - name: Fail on fixable Critical or High vulnerabilities (Trivy)
        id: gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/amd64
        with:
          image-ref: ${{ steps.release.outputs.ref }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          skip-setup-trivy: true
          trivy-config: ${{ hashFiles('trivy.yaml') != '' && 'trivy.yaml' || '.yggdrasil/defaults/trivy.yaml' }}
      - if: failure() && steps.gate.outcome == 'failure'
        env:
          REMEDY: "${{ matrix.remedy || 'Merge the open Dependabot base-image PR, or if there is none, any PR: the next release rebuilds on the current base.' }}"
        run: echo "::error::${REMEDY}"
